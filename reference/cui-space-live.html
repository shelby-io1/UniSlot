    <style>
      :root {
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f5fb;
        --card: #fff;
        --tx: #141a2b;
        --mu: #64708a;
        --ac: #2b3f9e;
        --acbg: #e4e9fb;
        --bd: #e2e6f0;
        --ok: #0b7a5c;
        --okbg: #dcf5ec;
        --busy: #b42318;
        --hero: linear-gradient(135deg, #3b2a8c, #1f4fb4);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1120;
          --card: #171c30;
          --tx: #eef1fb;
          --mu: #9aa5c2;
          --ac: #9db4ff;
          --acbg: #232c52;
          --bd: #283052;
          --ok: #5fe0b5;
          --okbg: #10382f;
          --busy: #ff8f85;
          --hero: linear-gradient(135deg, #2a1f66, #173a82);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1120;
        --card: #171c30;
        --tx: #eef1fb;
        --mu: #9aa5c2;
        --ac: #9db4ff;
        --acbg: #232c52;
        --bd: #283052;
        --ok: #5fe0b5;
        --okbg: #10382f;
        --busy: #ff8f85;
        --hero: linear-gradient(135deg, #2a1f66, #173a82);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        background: var(--hero);
        color: #fff;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 52px;
      }
      .hw {
        max-width: 680px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hw img {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 10px #0004;
      }
      .hw h1 {
        font-size: 19px;
        margin: 0;
        line-height: 1.2;
      }
      .hw p {
        margin: 2px 0 0;
        font-size: 12.5px;
        opacity: 0.85;
      }
      main {
        max-width: 680px;
        margin: -34px auto 0;
        padding: 0 14px 20px;
      }
      .tabs {
        display: flex;
        background: var(--card);
        border-radius: 16px;
        padding: 4px;
        box-shadow: 0 4px 18px #0002;
        position: sticky;
        top: 6px;
        z-index: 5;
      }
      .tabs button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--mu);
        padding: 9px 3px;
        border-radius: 12px;
        font: 600 12px/1.25 system-ui;
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--ac);
        color: var(--card);
      }
      .panel {
        margin-top: 14px;
      }
      .row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .chip {
        flex: 0 0 auto;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 12px;
        padding: 8px 13px;
        font: inherit;
        text-align: center;
        cursor: pointer;
      }
      .chip small {
        display: block;
        color: var(--mu);
        font-size: 11px;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: var(--card);
      }
      .chip.on small {
        color: inherit;
        opacity: 0.85;
      }
      select,
      input[type="search"] {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        color: var(--tx);
        font: inherit;
        margin: 2px 0 10px;
      }
      h2 {
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mu);
        margin: 16px 2px 8px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .free {
        background: var(--okbg);
        color: var(--ok);
        border-radius: 10px;
        padding: 7px 12px;
        font-weight: 700;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .card.today {
        border-color: var(--ac);
        box-shadow: 0 0 0 1px var(--ac);
      }
      .card h3 {
        margin: 0;
        padding: 10px 14px;
        font-size: 15px;
        background: var(--acbg);
        color: var(--ac);
        display: flex;
        justify-content: space-between;
      }
      .card h3 span {
        font-size: 11px;
        background: var(--ac);
        color: var(--card);
        border-radius: 8px;
        padding: 2px 8px;
        align-self: center;
      }
      .it {
        display: flex;
        gap: 12px;
        padding: 10px 14px;
        border-top: 1px solid var(--bd);
      }
      .it:first-of-type {
        border-top: 0;
      }
      .tm {
        flex: 0 0 58px;
        font-size: 12.5px;
        color: var(--mu);
        font-variant-numeric: tabular-nums;
        line-height: 1.3;
      }
      .tm b {
        color: var(--tx);
        display: block;
        font-size: 13.5px;
      }
      .it .s {
        font-weight: 650;
      }
      .it .m {
        color: var(--mu);
        font-size: 13px;
      }
      .rp {
        font-size: 10.5px;
        background: #fde9c8;
        color: #8a5200;
        border-radius: 6px;
        padding: 1px 6px;
        margin-left: 6px;
        font-weight: 700;
      }
      .empty {
        padding: 12px 14px;
        color: var(--mu);
        font-size: 14px;
      }
      .list > div {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 9px 12px;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .list .m {
        color: var(--mu);
        font-size: 13px;
        text-align: right;
      }
      .busy {
        color: var(--busy);
        font-weight: 600;
      }
      .note {
        background: var(--acbg);
        color: var(--ac);
        padding: 10px 12px;
        border-radius: 12px;
        margin: 8px 0;
        font-size: 14px;
      }
      .foot {
        color: var(--mu);
        font-size: 12px;
        margin: 8px 4px;
      }
      footer {
        text-align: center;
        padding: 20px 14px 28px;
        color: var(--mu);
        font-size: 14px;
      }
      footer b {
        color: var(--ac);
      }

            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        },
      };
      (function () {
        const n = new Date(),
          w = n.getDay(),
          m = n.getHours() * 60 + n.getMinutes();
        if (w >= 1 && w <= 5) {
          today = w - 1;
          day = today;
          const s = ST.findIndex((x) => m < x[1]);
          slot = s < 0 ? 4 : s;
          cur = slot;
        }
        const b = ls.get("cui_b"),
          t = ls.get("cui_t");
        if (b !== null && D.b[+b]) bsel = +b;
        if (t !== null && D.t[+t]) tsel = +t;
      })();
      const nat = (a, b) => a.localeCompare(b, undefined, { numeric: true });
      const grp = (r) =>
        /^LH/.test(r)
          ? "Lecture halls"
          : /^CR/.test(r)
            ? "Classrooms"
            : /^LT/.test(r)
              ? "Lecture theatres"
              : "Labs";
      function chips(items, cur, fn, id) {
        return (
          '<div class="row">' +
          items
            .map(
              (t, i) =>
                '<button class="chip' +
                (i === cur ? " on" : "") +
                '" data-' +
                id +
                '="' +
                i +
                '">' +
                t +
                "</button>",
            )
            .join("") +
          "</div>"
        );
      }
      function week(rows, mode) {
        let h = "";
        for (let d = 0; d < 5; d++) {
          const r = rows.filter((e) => e[0] === d).sort((a, b) => a[1] - b[1]);
          const m = [];
          r.forEach((e) => {
            const k = [e[2], e[3], e[4], e[5]].join();
            const p = m[m.length - 1];
            if (p && p.k === k && p.e === e[1] - 1) p.e = e[1];
            else m.push({ k, s: e[1], e: e[1], x: e });
          });
          h +=
            '<div class="card' +
            (d === today ? " today" : "") +
            '"><h3>' +
            DAYS[d] +
            (d === today ? "<span>Today</span>" : "") +
            "</h3>";
          if (!m.length) h += '<div class="empty">No classes</div>';
          m.forEach((o) => {
            const e = o.x;
            const meta =
              mode === "b"
                ? [e[4] >= 0 ? D.t[e[4]] : "", e[3] >= 0 ? D.r[e[3]] : ""]
                : [D.b[e[2]], e[3] >= 0 ? D.r[e[3]] : ""];
            h +=
              '<div class="it"><div class="tm"><b>' +
              TM[o.s][0] +
              "</b>" +
              TM[o.e][1] +
              '</div><div><div class="s">' +
              esc(D.s[e[5]]) +
              (e[6] ? '<span class="rp">Repeater</span>' : "") +
              '</div><div class="m">' +
              esc(meta.filter(Boolean).join(" · ")) +
              "</div></div></div>";
          });
          h += "</div>";
        }
        return h;
      }
      function free() {
        const now = D.e.filter((e) => e[0] === day && e[1] === slot),
          bR = {},
          bT = {};
        now.forEach((e) => {
          const b = D.b[e[2]];
          if (e[3] >= 0) (bR[e[3]] = bR[e[3]] || []).push(b + (e[4] >= 0 ? " · " + D.t[e[4]] : ""));
          if (e[4] >= 0) (bT[e[4]] = bT[e[4]] || []).push(b + (e[3] >= 0 ? " · " + D.r[e[3]] : ""));
        });
        let h =
          chips(
            DAYS.map((d) => d.slice(0, 3)),
            day,
            0,
            "d",
          ) +
          chips(
            TM.map((t, i) => "L" + (i + 1) + "<small>" + t[0] + "–" + t[1] + "</small>"),
            slot,
            0,
            "s",
          );
        h +=
          '<div class="note">' +
          (day === today && slot === cur ? "Showing right now: " : "Showing: ") +
          DAYS[day] +
          ", Lecture " +
          (slot + 1) +
          " (" +
          TM[slot][0] +
          "–" +
          TM[slot][1] +
          ")" +
          (day === today && slot === cur
            ? ""
            : ' <a href="#" data-now="1" style="color:inherit;font-weight:700">Back to now</a>') +
          '</div><input id="q" type="search" placeholder="' +
          (tab === 0 ? "Search room…" : "Search faculty…") +
          '" value="' +
          esc(q) +
          '">';
        if (day === 2 && slot === 1)
          h +=
            '<div class="note">Wednesday 10:00–11:30 is the AS slot, so no regular classes are scheduled and everything shows as free.</div>';
        const qq = q.trim().toLowerCase();
        if (tab === 0) {
          const all = D.r.map((r, i) => [r, i]).filter((x) => x[0].toLowerCase().includes(qq)),
            f = all.filter((x) => !bR[x[1]]),
            b = all.filter((x) => bR[x[1]]);
          h += "<h2>" + f.length + " rooms free</h2>";
          ["Lecture halls", "Classrooms", "Lecture theatres", "Labs"].forEach((g) => {
            const l = f.filter((x) => grp(x[0]) === g).map((x) => x[0]);
            if (l.length)
              h +=
                "<h2>" +
                g +
                '</h2><div class="grid">' +
                l.map((r) => '<span class="free">' + esc(r) + "</span>").join("") +
                "</div>";
          });
          h +=
            "<h2>" +
            b.length +
            ' rooms busy</h2><div class="list">' +
            b
              .map(
                (x) =>
                  '<div><span class="busy">' +
                  esc(x[0]) +
                  '</span><span class="m">' +
                  esc(bR[x[1]].join(" | ")) +
                  "</span></div>",
              )
              .join("") +
            "</div>";
        } else {
          const all = D.t.map((t, i) => [t, i]).filter((x) => x[0].toLowerCase().includes(qq)),
            f = all.filter((x) => !bT[x[1]]),
            b = all.filter((x) => bT[x[1]]);
          h +=
            "<h2>" +
            f.length +
            ' faculty free</h2><div class="list">' +
            f
              .map(
                (x) =>
                  "<div><span>" +
                  esc(x[0]) +
                  '</span><span class="m" style="color:var(--ok)">Free</span></div>',
              )
              .join("") +
            "</div>";
          h +=
            "<h2>" +
            b.length +
            ' faculty busy</h2><div class="list">' +
            b
              .map(
                (x) =>
                  '<div><span class="busy">' +
                  esc(x[0]) +
                  '</span><span class="m">' +
                  esc(bT[x[1]].join(" | ")) +
                  "</span></div>",
              )
              .join("") +
            "</div>";
        }
        return h;
      }
      function batch() {
        const g = {};
        D.b.forEach((b, i) => {
          const p = b.replace(/-[IVX]+$/, "");
          (g[p] = g[p] || []).push([b, i]);
        });
        let h =
          '<select id="sb">' +
          Object.keys(g)
            .map(
              (p) =>
                '<optgroup label="' +
                esc(p) +
                '">' +
                g[p]
                  .map(
                    (x) =>
                      '<option value="' +
                      x[1] +
                      '"' +
                      (x[1] === bsel ? " selected" : "") +
                      ">" +
                      esc(x[0]) +
                      "</option>",
                  )
                  .join("") +
                "</optgroup>",
            )
            .join("") +
          "</select>";
        return (
          h +
          week(
            D.e.filter((e) => e[2] === bsel),
            "b",
          )
        );
      }
      function teacher() {
        let h =
          '<select id="st">' +
          D.t
            .map(
              (t, i) =>
                '<option value="' +
                i +
                '"' +
                (i === tsel ? " selected" : "") +
                ">" +
                esc(t) +
                "</option>",
            )
            .join("") +
          "</select>";
        return (
          h +
          week(
            D.e.filter((e) => e[4] === tsel),
            "t",
          )
        );
      }
      function render() {
        [0, 1, 2, 3].forEach((i) => ($("t" + i).className = i === tab ? "on" : ""));
        const keep = document.activeElement && document.activeElement.id === "q";
        $("out").innerHTML =
          [free, free, teacher, batch][tab]() +
          (tab < 2
            ? '<p class="foot">Only rooms and teachers that appear in the timetable are listed. Extra or make-up classes are not included, so please confirm before you go.</p>'
            : "");
        if (keep) {
          const i = $("q");
          i.focus();
          i.setSelectionRange(q.length, q.length);
        }
      }
      [0, 1, 2, 3].forEach(
        (i) =>
          ($("t" + i).onclick = () => {
            tab = i;
            q = "";
            render();
            scrollTo(0, 0);
          }),
      );
      $("out").addEventListener("click", (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.d !== undefined) day = +t.dataset.d;
        else if (t.dataset.s !== undefined) slot = +t.dataset.s;
        else return;
        render();
      });
      $("out").addEventListener("click", (e) => {
        const a = e.target.closest("a[data-now]");
        if (a) {
          e.preventDefault();
          day = today < 0 ? 0 : today;
          slot = cur;
          render();
        }
      });
      $("out").addEventListener("input", (e) => {
        if (e.target.id === "q") {
          q = e.target.value;
          render();
        }
      });
      $("out").addEventListener("change", (e) => {
        if (e.target.id === "sb") {
          bsel = +e.target.value;
          ls.set("cui_b", bsel);
          render();
        }
        if (e.target.id === "st") {
          tsel = +e.target.value;
          ls.set("cui_t", tsel);
          render();
        }
      });
      render();
    </script>
  </body>
</html>
